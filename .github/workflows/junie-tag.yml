# .github/workflows/junie-tag.yml
name: Junie (label trigger)

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  junie:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'junie') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'junie')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required to create branches, make commits, and push changes
      pull-requests: write   # Required to create PRs, add comments to PRs, and update PR status
      issues: write          # Required to add comments to issues and update issue metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Junie
        id: junie
        uses: JetBrains/junie-github-action@v0
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          label_trigger: junie
          use_single_comment: true
