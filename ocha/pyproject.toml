[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocha"
version = "0.1.0"
description = "Python/Textual rebuild scaffold for the ocha multi-agent TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58,<1.0",
]

[project.scripts]
ocha = "app.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.roles" = ["*.md"]
